[package]
name = "simulador_politica"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.32"
egui = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 0
debug = 0
codegen-units = 256
incremental = true

[profile.release]
lto = true
strip = true
opt-level = 3